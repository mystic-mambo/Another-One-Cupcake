<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US.EXE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --dusk: #241a33;
    --plum: #3c2a52;
    --orchid: #a480d6;
    --rose: #f2a0b8;
    --peach: #ffd9b0;
    --paper: #fffaf4;
    --ink: #2c2038;
    --gold: #f0c178;
    --display: "Fraunces", Georgia, serif;
    --body: "Quicksand", "Segoe UI", sans-serif;
    --pixel: "VT323", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--paper);
    font-family: var(--body);
    font-size: 17px;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- aurora background ---------- */
  #aurora {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: var(--dusk);
    overflow: hidden;
  }
  #aurora .blob {
    position: absolute;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.55;
    animation: drift 26s ease-in-out infinite alternate;
  }
  #aurora .b1 { background: var(--orchid); top: -20%; left: -15%; }
  #aurora .b2 { background: var(--rose); bottom: -25%; right: -15%; animation-duration: 32s; animation-delay: -6s; }
  #aurora .b3 { background: var(--peach); top: 30%; right: 10%; width: 40vmax; height: 40vmax; opacity: 0.35; animation-duration: 38s; animation-delay: -14s; }
  @keyframes drift {
    to { transform: translate(6%, 8%) scale(1.08); }
  }

  #sparkles { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .spk {
    position: absolute;
    bottom: -20px;
    font-size: 14px;
    opacity: 0.55;
    animation: rise linear infinite;
  }
  @keyframes rise { to { transform: translateY(-110vh) translateX(var(--dx, 0px)); opacity: 0; } }

  /* ---------- scattered photos ---------- */
  #polaroids { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .polaroid {
    position: absolute;
    width: 122px;
    padding: 8px 8px 24px;
    background: var(--paper);
    box-shadow: 0 10px 22px -10px rgba(0, 0, 0, 0.55);
    pointer-events: auto;
  }
  .polaroid img {
    display: block;
    width: 100%;
    height: 108px;
    object-fit: cover;
    background: #efe6f7;
  }
  .polaroid .cap {
    display: block;
    margin-top: 6px;
    font-family: var(--pixel);
    font-size: 13px;
    color: var(--ink);
    text-align: center;
  }
  .polaroid .ph-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 108px;
    background: #efe6f7;
    color: var(--orchid);
    font-size: 13px;
    font-family: var(--pixel);
    text-align: center;
    padding: 4px;
  }

  /* ---------- desktop / icons ---------- */
  #desktop { position: fixed; inset: 0; z-index: 1; }
  #icons {
    position: absolute;
    top: 18px;
    left: 18px;
    display: grid;
    gap: 10px;
  }
  .icon {
    display: grid;
    justify-items: center;
    gap: 6px;
    width: 104px;
    padding: 8px 4px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid transparent;
    border-radius: 10px;
    text-align: center;
  }
  .icon:hover, .icon:focus-visible { border-color: rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.14); }
  .icon .g { font-size: 34px; line-height: 1; }
  .icon .n { font-family: var(--pixel); font-size: 15px; }

  /* ---------- windows ---------- */
  .win { position: absolute; width: min(460px, 92vw); z-index: 2; }
  .frame {
    background: var(--paper);
    color: var(--ink);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 40px -18px rgba(0, 0, 0, 0.6);
  }
  .tb {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 12px;
    background: linear-gradient(90deg, var(--plum), var(--orchid));
    color: #fff;
    font-family: var(--pixel);
    font-size: 16px;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .tb .x {
    width: 26px;
    height: 26px;
    padding: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    color: #fff;
    font-size: 13px;
    line-height: 1;
  }
  .body { padding: 18px 20px 20px; max-height: min(60vh, 440px); overflow: auto; }
  .body p { margin: 0 0 12px; }

  .btn {
    padding: 9px 16px;
    background: var(--orchid);
    color: #fff;
    border-radius: 999px;
    font-weight: 600;
    font-size: 15px;
  }
  .btn.gold { background: var(--gold); color: var(--ink); }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; }

  #letterText, #thoughtsText { white-space: pre-wrap; font-family: var(--display); font-style: italic; font-size: 19px; margin: 0; }
  .caret::after { content: "\258C"; color: var(--orchid); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .log { margin: 0; padding: 0; list-style: none; border-left: 3px solid var(--orchid); }
  .log li { position: relative; margin: 0 0 16px 18px; }
  .log li::before {
    content: "";
    position: absolute;
    left: -26px;
    top: 6px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--rose);
    border: 2px solid var(--ink);
  }
  .log b { display: block; font-weight: 600; color: var(--plum); font-size: 14px; }
  .log .mem-photo {
    width: 86px;
    height: 68px;
    object-fit: cover;
    border-radius: 8px;
    float: right;
    margin: 0 0 8px 10px;
  }

  /* ---------- minigames ---------- */
  .game-hud { display: flex; justify-content: space-between; font-size: 14px; color: var(--plum); margin-bottom: 8px; }
  #catchWrap {
    position: relative;
    height: 260px;
    border-radius: 12px;
    overflow: hidden;
    background: #f4edfb;
    touch-action: none;
  }
  .drop { position: absolute; top: -34px; font-size: 28px; line-height: 1; background: none; border: 0; padding: 4px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(300px); } }

  .match-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .match-card {
    aspect-ratio: 1;
    border-radius: 10px;
    background: var(--orchid);
    color: transparent;
    font-size: 26px;
    display: grid;
    place-items: center;
    transition: background 0.15s ease;
  }
  .match-card.open { background: var(--paper); color: var(--ink); border: 2px solid var(--orchid); }
  .match-card.matched { background: #e3f3e3; color: var(--ink); border: 2px solid #7eb87e; }
  #matchMsg, #quizMsg { margin-top: 12px; min-height: 1.4em; font-weight: 600; color: var(--plum); }

  .quiz-opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 14px; border-radius: 10px; background: #f4edfb; }
  .quiz-opt.right { background: #dcf1dc; }
  .quiz-opt.wrong { background: #fbdede; }

  /* ---------- taskbar ---------- */
  #task {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 3;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 14px;
    background: rgba(36, 26, 51, 0.75);
    backdrop-filter: blur(6px);
    font-family: var(--pixel);
    font-size: 17px;
  }
  .tray { display: flex; align-items: center; gap: 14px; }
  #heart { padding: 3px 10px; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 999px; }
  #heart:active { background: rgba(255, 255, 255, 0.2); }

  #toast {
    position: fixed;
    left: 50%; bottom: 64px;
    z-index: 5;
    transform: translateX(-50%);
    max-width: 90vw;
    padding: 10px 16px;
    background: var(--gold);
    color: var(--ink);
    border-radius: 999px;
    font-weight: 600;
    box-shadow: 0 10px 20px -10px rgba(0, 0, 0, 0.5);
    text-align: center;
  }

  /* ---------- boot ---------- */
  #boot {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8vh 7vw;
  }
  #bootLog { min-height: 7em; white-space: pre-wrap; color: var(--rose); font-family: var(--pixel); font-size: 20px; }
  .meter { max-width: 480px; height: 20px; margin-top: 12px; padding: 2px; border: 2px solid var(--rose); border-radius: 999px; overflow: hidden; }
  .meter > i { display: block; width: 0; height: 100%; background: var(--gold); transition: width 0.4s steps(8); }
  #bootDialog {
    position: absolute;
    left: 50%; top: 50%;
    width: min(400px, 90vw);
    transform: translate(-50%, -50%);
  }

  @media (max-width: 680px) {
    #polaroids { display: none; }
  }
  @media (max-width: 640px) {
    body { font-size: 16px; }
    #icons { top: 10px; left: 0; right: 0; grid-template-columns: repeat(3, 1fr); gap: 0; justify-items: center; }
    .icon { width: auto; }
    .win { left: 4vw; right: 4vw; width: auto; top: 108px; }
    .body { max-height: calc(100vh - 108px - 48px - 46px); }
  }
  @media (prefers-reduced-motion: reduce) {
    #aurora .blob { animation: none; }
    .spk { animation: none; opacity: 0; }
    .meter > i { transition: none; }
    .caret::after { animation: none; }
    .drop { animation: none; }
  }
</style>
</head>
<body>

<div id="aurora" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<div id="sparkles" aria-hidden="true"></div>
<div id="polaroids" aria-hidden="true"></div>

<!-- ===================== BOOT ===================== -->
<div id="boot">
  <div id="bootLog" aria-live="polite"></div>
  <div class="meter" aria-hidden="true"><i id="bootFill"></i></div>

  <div class="frame" id="bootDialog" role="dialog" aria-labelledby="dlgTitle" hidden>
    <div class="tb"><span id="dlgTitle">gift_detected</span></div>
    <div class="body">
      <p id="dlgText"></p>
      <div class="btns"><button class="btn gold" id="enterBtn">Open</button></div>
    </div>
  </div>
</div>

<!-- ===================== DESKTOP ===================== -->
<div id="desktop" hidden>
  <nav id="icons" aria-label="things to open"></nav>

  <section class="frame win" id="w-letter" aria-label="letter.txt" hidden>
    <div class="tb"><span>letter.txt</span><button class="x" aria-label="close letter.txt">x</button></div>
    <div class="body"><p id="letterText"></p></div>
  </section>

  <section class="frame win" id="w-thoughts" aria-label="what i think about u" hidden>
    <div class="tb"><span>what i think about u</span><button class="x" aria-label="close what i think about u">x</button></div>
    <div class="body"><p id="thoughtsText"></p></div>
  </section>

  <section class="frame win" id="w-us" aria-label="us.dat" hidden>
    <div class="tb"><span>us.dat</span><button class="x" aria-label="close us.dat">x</button></div>
    <div class="body"><ul class="log" id="usLog"></ul></div>
  </section>

  <section class="frame win" id="w-catch" aria-label="catch.exe" hidden>
    <div class="tb"><span>catch.exe</span><button class="x" aria-label="close catch.exe">x</button></div>
    <div class="body">
      <p id="catchIntro"></p>
      <div class="game-hud"><span id="catchCount"></span><span id="catchTimer"></span></div>
      <div id="catchWrap"></div>
      <p id="catchMsg"></p>
      <div class="btns" id="catchRestartWrap" hidden><button class="btn" id="catchRestart">Play again</button></div>
    </div>
  </section>

  <section class="frame win" id="w-match" aria-label="match.exe" hidden>
    <div class="tb"><span>match.exe</span><button class="x" aria-label="close match.exe">x</button></div>
    <div class="body">
      <p id="matchIntro"></p>
      <div class="match-grid" id="matchGrid"></div>
      <p id="matchMsg"></p>
      <div class="btns" id="matchRestartWrap" hidden><button class="btn" id="matchRestart">Play again</button></div>
    </div>
  </section>

  <section class="frame win" id="w-quiz" aria-label="quiz.exe" hidden>
    <div class="tb"><span>quiz.exe</span><button class="x" aria-label="close quiz.exe">x</button></div>
    <div class="body">
      <p id="quizQ"></p>
      <div id="quizOpts"></div>
      <p id="quizMsg"></p>
      <div class="btns" id="quizNextWrap" hidden><button class="btn" id="quizNext">Next question</button></div>
      <div class="btns" id="quizRestartWrap" hidden><button class="btn" id="quizRestart">Play again</button></div>
    </div>
  </section>

  <div id="task">
    <span id="tk-title"></span>
    <span>System status: FOR YOU</span>
    <span class="tray">
      <button id="heart" aria-label="send a heart">💜 <span id="heartN">0</span></button>
      <span id="clock"></span>
    </span>
  </div>
  <div id="toast" role="status" hidden></div>
</div>

/* ---------- boot ---------- */
async function boot() {
  const lines = [
    `${CONFIG.title} v1.0`,
    "loading warmth...... ok",
    `locating ${CONFIG.to}...... found`,
    "preparing a soft place to land...... ok"
  ];
  const log = $("#bootLog");
  const fill = $("#bootFill");
  for (let i = 0; i < lines.length; i++) {
    log.textContent += lines[i] + "\n";
    fill.style.width = ((i + 1) / lines.length * 100) + "%";
    await sleep(600);
  }
  await sleep(300);
  $("#bootDialog").hidden = false;
  $("#enterBtn").focus();
}

/* ---------- window manager ---------- */
let z = 10;
let stagger = 0;
const onOpen = {};

function front(w) { w.style.zIndex = ++z; }

function openWin(id) {
  const w = $("#w-" + id);
  if (w.hidden) {
    w.hidden = false;
    if (!narrow() && !w.dataset.placed) {
      const left = Math.min(170 + stagger * 26, Math.max(0, innerWidth - 480));
      w.style.left = left + "px";
      w.style.top = (36 + stagger * 26) + "px";
      stagger = (stagger + 1) % 6;
      w.dataset.placed = "1";
    }
    if (onOpen[id]) onOpen[id](w);
  }
  front(w);
}

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-open]");
  if (btn) openWin(btn.dataset.open);
});

$$(".win").forEach(w => {
  const tb = $(".tb", w);
  w.addEventListener("pointerdown", () => front(w));
  $(".x", w).addEventListener("click", () => { w.hidden = true; });

  tb.addEventListener("pointerdown", e => {
    if (narrow() || e.target.closest(".x")) return;
    const r = w.getBoundingClientRect();
    const dx = e.clientX - r.left;
    const dy = e.clientY - r.top;
    tb.setPointerCapture(e.pointerId);
    const move = ev => {
      w.style.left = Math.max(0, Math.min(innerWidth - 80, ev.clientX - dx)) + "px";
      w.style.top = Math.max(0, Math.min(innerHeight - 100, ev.clientY - dy)) + "px";
    };
    const up = () => {
      tb.removeEventListener("pointermove", move);
      tb.removeEventListener("pointerup", up);
    };
    tb.addEventListener("pointermove", move);
    tb.addEventListener("pointerup", up);
  });
});

/* ---------- shared typing effect (speed scales with length) ---------- */
async function typeOut(el, winEl, lines) {
  const chars = Array.from(lines.join("\n\n"));
  // Longer text types faster, so it never drags past ~16s; short notes stay slow and deliberate.
  const perChar = Math.max(7, Math.min(24, 9000 / Math.max(1, chars.length)));
  const parPause = perChar * 7;

  let skip = false;
  winEl.addEventListener("click", () => { skip = true; }, { once: true });
  el.classList.add("caret");
  let out = "";
  for (const c of chars) {
    if (skip || reduce) break;
    out += c;
    el.textContent = out;
    await new Promise(r => setTimeout(r, c === "\n" ? parPause : perChar));
  }
  el.textContent = chars.join("");
  el.classList.remove("caret");
}

onOpen.letter = w => {
  if (w.dataset.done) return;
  w.dataset.done = "1";
  typeOut($("#letterText"), w, CONFIG.letter);
};

onOpen.thoughts = w => {
  if (w.dataset.done) return;
  w.dataset.done = "1";
  typeOut($("#thoughtsText"), w, CONFIG.thoughts);
};

/* ---------- game: catch the hearts ---------- */
onOpen.catch = w => { startCatch(); };
function startCatch() {
  const g = CONFIG.games.catch;
  const wrap = $("#catchWrap");
  wrap.innerHTML = "";
  $("#catchIntro").textContent = g.intro;
  $("#catchMsg").textContent = "";
  $("#catchRestartWrap").hidden = true;

  let caught = 0, timeLeft = g.seconds, finished = false, spawnId, tickId;
  const countEl = $("#catchCount"), timerEl = $("#catchTimer");
  countEl.textContent = `Caught: 0 / ${g.target}`;
  timerEl.textContent = `Time: ${timeLeft}s`;

  function finish(won) {
    if (finished) return;
    finished = true;
    clearInterval(spawnId);
    clearInterval(tickId);
    $$(".drop", wrap).forEach(d => d.remove());
    $("#catchMsg").textContent = won ? g.winText : g.outOfTimeText;
    $("#catchRestartWrap").hidden = false;
  }

  function spawnHeart() {
    if (finished) return;
    const d = document.createElement("button");
    d.className = "drop";
    d.type = "button";
    d.textContent = Math.random() < 0.85 ? "💜" : "✨";
    const maxLeft = Math.max(0, wrap.clientWidth - 34);
    d.style.left = (Math.random() * maxLeft) + "px";
    const dur = 2.4 + Math.random() * 1.6;
    d.style.animationDuration = dur + "s";
    d.addEventListener("animationend", () => d.remove());
    d.addEventListener("click", () => {
      if (finished) return;
      caught++;
      countEl.textContent = `Caught: ${caught} / ${g.target}`;
      d.remove();
      if (caught >= g.target) finish(true);
    });
    wrap.appendChild(d);
  }

  if (reduce) { finish(true); return; }
  spawnId = setInterval(spawnHeart, 430);
  tickId = setInterval(() => {
    timeLeft--;
    timerEl.textContent = `Time: ${Math.max(0, timeLeft)}s`;
    if (timeLeft <= 0) finish(caught >= g.target);
  }, 1000);
}
$("#catchRestart").addEventListener("click", startCatch);

/* ---------- game: memory match ---------- */
onOpen.match = w => { startMatch(); };
function startMatch() {
  const g = CONFIG.games.match;
  const grid = $("#matchGrid");
  grid.innerHTML = "";
  $("#matchIntro").textContent = g.intro;
  $("#matchMsg").textContent = "";
  $("#matchRestartWrap").hidden = true;

  const deck = [...g.symbols, ...g.symbols]
    .map(s => ({ s, k: Math.random() }))
    .sort((a, b) => a.k - b.k)
    .map(x => x.s);

  let open = [];
  let lock = false;
  let matched = 0;

  deck.forEach((sym, i) => {
    const card = document.createElement("button");
    card.className = "match-card";
    card.type = "button";
    card.dataset.sym = sym;
    card.dataset.idx = i;
    card.textContent = sym;
    card.addEventListener("click", () => {
      if (lock || card.classList.contains("open") || card.classList.contains("matched")) return;
      card.classList.add("open");
      open.push(card);
      if (open.length === 2) {
        lock = true;
        const [a, b] = open;
        if (a.dataset.sym === b.dataset.sym) {
          a.classList.add("matched");
          b.classList.add("matched");
          matched += 2;
          open = [];
          lock = false;
          if (matched === deck.length) {
            $("#matchMsg").textContent = g.winText;
            $("#matchRestartWrap").hidden = false;
          }
        } else {
          setTimeout(() => {
            a.classList.remove("open");
            b.classList.remove("open");
            open = [];
            lock = false;
          }, reduce ? 0 : 650);
        }
      }
    });
    grid.appendChild(card);
  });
}
$("#matchRestart").addEventListener("click", startMatch);

let quizIdx = 0;
function startQuiz() {
  quizIdx = 0;

  $("#quizMsg").textContent = "";

function showQuizQuestion() {
  const g = CONFIG.games.quiz;
  $("#quizNextWrap").hidden = true;
  $("#quizMsg").textContent = "";
  if (quizIdx === 0) $("#quizQ").dataset.intro = g.intro;

  const q = g.questions[quizIdx];
  $("#quizQ").textContent = (quizIdx === 0 ? g.intro + " " : "") + q.q;
  const opts = $("#quizOpts");
  opts.innerHTML = "";
  q.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "btn quiz-opt";
    b.textContent = text;
    b.addEventListener("click", () => {
      $$(".quiz-opt", opts).forEach(o => o.disabled = true);
      b.classList.add(i === q.correct ? "right" : "wrong");
      if (i !== q.correct) opts.children[q.correct].classList.add("right");
      const isLast = quizIdx === g.questions.length - 1;
      if (isLast) {
        $("#quizMsg").textContent = g.winText;
        $("#quizRestartWrap").hidden = false;
      } else {
        $("#quizNextWrap").hidden = false;
      }
    });
    opts.appendChild(b);
  });
}
$("#quizNext").addEventListener("click", () => { quizIdx++; showQuizQuestion(); });
$("#quizRestart").addEventListener("click", startQuiz);

/* ---------- taskbar ---------- */
let hearts = 0, toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
$("#heart").addEventListener("click", () => {
  hearts++;
  $("#heartN").textContent = hearts;
  if (hearts === 10) toast("Okay, that's a lot of hearts. Keep going. 💜");
});
function tick() { $("#clock").textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
tick();
setInterval(tick, 30000);

/* ---------- ambient sparkles ---------- */
if (!reduce) {
  const sky = $("#sparkles");
  const glyphs = ["✨", "💫", "・"];
  function spawnSpark() {
    const p = document.createElement("span");
    p.className = "spk";
    p.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    p.style.left = Math.random() * 100 + "vw";
    p.style.setProperty("--dx", (Math.random() * 50 - 25) + "px");
    p.style.animationDuration = (10 + Math.random() * 6) + "s";
    sky.appendChild(p);
    setTimeout(() => p.remove(), 17000);
  }
  for (let i = 0; i < 5; i++) setTimeout(spawnSpark, i * 1000);
  setInterval(spawnSpark, 2400);
}

boot();
</script>
</body>
</html>
